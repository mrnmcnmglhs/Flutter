name: app_to_do
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - images/Splash.png
    - images/nuvem_lapis.png
    - images/mao_lapis.png

  fonts:
    - family: Bestigia
      fonts:
        - asset: fonts/bestigia/Bestigia-Regular.ttf
    - family: Rinnero
      fonts:
        - asset: fonts/rinnero/Rinnero.ttf